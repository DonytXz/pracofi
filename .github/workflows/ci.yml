name: Web checks

on:
  pull_request:
  push:
    branches: [main, feature/web-app-v2]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnostic install
        run: |
          OUT=$(npm ci 2>&1 || true)
          echo "::error title=NPM_CI_LOG::${OUT//$'\n'/'%0A'}"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run check:build
